steps:
  # Build React frontend
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']
    dir: 'frontend'

  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'frontend'
    env:
      - 'VITE_API_URL='

  # Copy built frontend into backend/static
  - name: 'ubuntu'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'cp -r frontend/dist backend/static'

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_IMAGE'
      - '-f'
      - 'backend/Dockerfile.cloudrun'
      - 'backend'

  # Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_IMAGE']

  # Deploy the new image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE'
      - '--image=$_IMAGE'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=$_SERVICE_ACCOUNT'

images:
  - '$_IMAGE'

substitutions:
  _SERVICE: 'mahitha-booking-api'
  _REGION: 'us-east4'
  _IMAGE: 'us-east4-docker.pkg.dev/$PROJECT_ID/mahitha-booking/mahitha-booking-api'
  _SERVICE_ACCOUNT: 'mahitha-booking-api@$PROJECT_ID.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY
