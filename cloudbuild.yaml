steps:
  # Build React frontend
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']
    dir: 'frontend'

  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'frontend'
    env:
      - 'VITE_API_URL='

  # Copy built frontend into backend/static
  - name: 'ubuntu'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'cp -r frontend/dist backend/static'

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_IMAGE'
      - '-f'
      - 'backend/Dockerfile.cloudrun'
      - 'backend'

images:
  - '$_IMAGE'
